name: CI - Tests (with Kafka)

on:
  push:
    branches: [ flow, main ]
  pull_request:
    branches: [ flow, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests (Kafka-enabled)
        env:
          MAVEN_OPTS: -Xmx1024m
        run: mvn -B -Pkafka-tests test
